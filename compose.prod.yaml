services:
  laravel.test:
    build:
      context: './docker/sail/runtimes/8.5'
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: 'sail-8.5/app'
    # Límites para no quitar recursos a otros servicios del VPS (p. ej. un servidor de Minecraft).
    # También afectan a npm run build durante el despliegue: tarda algo más, pero sin picos.
    cpus: '${APP_CPUS:-1.5}'
    mem_limit: '${APP_MEM_LIMIT:-2g}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: 'off'
      # Procesos PHP que atienden peticiones en paralelo. Debe ser variable del
      # contenedor: con la config cacheada (php artisan optimize) Laravel no lee .env.
      PHP_CLI_SERVER_WORKERS: '${PHP_CLI_SERVER_WORKERS:-2}'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      - mysql

  mysql:
    image: 'mysql:8.4'
    cpus: '${MYSQL_CPUS:-1}'
    mem_limit: '${MYSQL_MEM_LIMIT:-1536m}'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
    volumes:
      - 'sail-mysql:/var/lib/mysql'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD}'
      retries: 3
      timeout: 5s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: '${APP_DOMAIN}'
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile:ro'
      - 'caddy_data:/data'
      - 'caddy_config:/config'
    networks:
      - sail
    depends_on:
      - laravel.test

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
